# Anypoint Platform Configuration
# This file contains environment-specific configuration for Anypoint Platform integration

# OAuth2 Token Endpoint
anypoint.oauth2.token.url=https://anypoint.mulesoft.com/accounts/api/v2/oauth2/token

# Environment-specific Organization IDs (update these with your actual org IDs)
anypoint.org.id.dev=your-dev-org-id
anypoint.org.id.stage=your-stage-org-id  
anypoint.org.id.prod=your-prod-org-id

# API Endpoints
anypoint.api.base.url=https://anypoint.mulesoft.com
anypoint.exchange.api.url=https://anypoint.mulesoft.com/exchange/api/v2
anypoint.cloudhub.api.url=https://anypoint.mulesoft.com/cloudhub/api/v2

# Token settings
anypoint.token.cache.duration=3600
anypoint.token.retry.attempts=3
anypoint.token.retry.delay=5

# Deployment settings
deployment.timeout.minutes=30
deployment.retry.attempts=3
deployment.health.check.timeout=300